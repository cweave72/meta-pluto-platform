# Pluto distro. Uses the Poky distro as its base.

# Set these defaults before poky.conf. poky.conf uses "?=" for them.
# local.conf can still change them.
PACKAGE_CLASSES ?= "package_ipk"
INIT_MANAGER ?= "mdev-busybox"

require conf/distro/poky.conf

DISTRO = "pluto"
DISTRO_NAME = "Pluto Linux"

# Busybox init runs the scripts in /etc/rcS.d and /etc/rc5.d.
# The "sysvinit" feature makes update-rc.d create these links and adds
# initscripts. Without it, no init script starts (mdev, syslog, dropbear).
DISTRO_FEATURES:append = " sysvinit"
