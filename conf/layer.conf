# Add this layer to the BitBake search path.
BBPATH .= ":${LAYERDIR}"

# Find the recipes and appends in this layer.
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "pluto-platform"
BBFILE_PATTERN_pluto-platform = "^${LAYERDIR}/"
BBFILE_PRIORITY_pluto-platform = "10"

# core: openembedded-core. yocto: meta-poky (Poky distro).
# openembedded-layer: meta-oe (dfu-util-native).
LAYERDEPENDS_pluto-platform = "core yocto openembedded-layer"
LAYERSERIES_COMPAT_pluto-platform = "wrynose"
