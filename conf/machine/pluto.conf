#@TYPE: Machine
#@NAME: pluto
#@DESCRIPTION: ADALM-PLUTO (Zynq XC7Z010, dual Cortex-A9, 512 MB DDR3L, 32 MB QSPI).

require conf/machine/include/arm/armv7a/tune-cortexa9.inc
DEFAULTTUNE = "cortexa9thf-neon"

# Login prompt on the PS UART (ADALM-UARTJTAG adapter).
SERIAL_CONSOLES = "115200;ttyPS0"

# Kernel. The pluto-fit recipe puts zImage and the DTBs into the FIT image.
PREFERRED_PROVIDER_virtual/kernel = "linux-pluto"
KERNEL_IMAGETYPE = "zImage"
KERNEL_EXTRA_ARGS += "UIMAGE_LOADADDR=0x8000"
KERNEL_DEVICETREE = " \
    xilinx/zynq-pluto-sdr.dtb \
    xilinx/zynq-pluto-sdr-revb.dtb \
    xilinx/zynq-pluto-sdr-revc.dtb \
    "
# Keep the __symbols__ node. Device tree overlays need it.
KERNEL_DTC_FLAGS = "-@"

MACHINE_FEATURES = "usbgadget"

# Every image is an initramfs (gzip cpio). The FIT image and the JTAG boot use it.
IMAGE_FSTYPES ?= "cpio.gz"

# Base packages for every image (packagegroup-core-boot includes this list).
# Edit recipes-core/packagegroups/packagegroup-pluto-platform.bb to change them.
MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "packagegroup-pluto-platform"

# The stock QSPI FSBL and u-boot boot the board. Yocto builds no bootloader.
# pluto-jtag-bootstrap deploys the ADI JTAG boot files with each image.
EXTRA_IMAGEDEPENDS = "pluto-jtag-bootstrap"
